name: Bealach
options:
  bundleIdPrefix: app.bealach
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  BealachPackage:
    path: ../ios
targets:
  Bealach:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        type: group
        buildPhase: resources
        excludes:
          - Info.plist
          - Bealach.entitlements
    dependencies:
      - package: BealachPackage
        product: BealachRuntime
      - package: BealachPackage
        product: BealachCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bealach.ios
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Bealach.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6U62M4232W
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
